<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rohan's Journey Chatbot (Path B)</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f9f9f9; margin:0; padding:0; }
    .chat-interface { max-width:600px; margin:40px auto; border:1px solid #ddd; background:white; border-radius:8px; display:flex; flex-direction:column; height:80vh; }
    .chat-header { background:#4CAF50; color:white; padding:12px; border-radius:8px 8px 0 0; font-size:18px; }
    .chat-messages { flex:1; overflow-y:auto; padding:12px; }
    .message { margin:6px 0; padding:8px 12px; border-radius:6px; }
    .message.user { background:#e1f5fe; text-align:right; }
    .message.ai { background:#eeeeee; text-align:left; }
    .chat-input { display:flex; border-top:1px solid #ddd; }
    .chat-input input { flex:1; border:none; padding:10px; font-size:16px; }
    .chat-input button { background:#4CAF50; color:white; border:none; padding:10px 16px; cursor:pointer; }
  </style>
</head>
<body>
  <div class="chat-interface">
    <div class="chat-header">Rohan's Journey Assistant</div>
    <div class="chat-messages">
      <div class="message ai">Hello! Ask me anything about Rohan's 8-month Elyx journey 📊</div>
    </div>
    <div class="chat-input">
      <input type="text" placeholder="Type your question...">
      <button>Send</button>
    </div>
  </div>

<script>
let DOCS = [];
let IDF = {};
let journeyData = {};

// ------------------- Load JSON -------------------
async function loadJourney() {
  const res = await fetch("elyx_journey_json.json");
  journeyData = await res.json();

  // stats
  DOCS.push({
    id: "stats",
    text: `Summary Stats:
Total messages: ${journeyData.summary_stats.total_messages}
Doctor hours: ${journeyData.summary_stats.doctor_hours}
Coach hours: ${journeyData.summary_stats.coach_hours}
Adherence: ${journeyData.summary_stats.average_adherence}
Weight change: ${journeyData.summary_stats.total_weight_loss}
Final HbA1c: ${journeyData.summary_stats.final_hba1c}
Final BP: ${journeyData.summary_stats.final_bp}`
  });

  // conversations
  const weeks = journeyData.conversations_by_week || {};
  for (const wk in weeks) {
    const w = weeks[wk];
    (w.messages || []).forEach((m, i) => {
      DOCS.push({
        id: `${wk}-${i}`,
        text: `Week: ${wk} | Phase: ${w.phase} | Date: ${m.date} ${m.time} | ${m.sender}: ${m.message}`
      });
    });
  }
  buildIdf();
}

// ------------------- TF-IDF retrieval -------------------
function tokenize(t){return (t||"").toLowerCase().match(/[a-z0-9%/.:+-]+/g)||[];}
function buildIdf(){
  const df = {};
  DOCS.forEach(d => {
    const uniq = new Set(tokenize(d.text));
    uniq.forEach(tok => df[tok]=(df[tok]||0)+1);
  });
  const N = DOCS.length;
  for (const tok in df) IDF[tok] = Math.log((N+1)/(df[tok]+1)) + 1;
}
function score(docText, query){
  const qToks = tokenize(query);
  const qCounts = {};
  qToks.forEach(t => qCounts[t]=(qCounts[t]||0)+1);
  const dToks = tokenize(docText);
  const dCounts = {};
  dToks.forEach(t => dCounts[t]=(dCounts[t]||0)+1);

  let s = 0;
  qToks.forEach(t => {
    const tfq = qCounts[t] || 0;
    const tfd = dCounts[t] || 0;
    const idf = IDF[t] || 0;
    s += (tfq*idf) * (tfd*idf);
  });
  return s;
}
function topKDocs(query, k=8){
  return DOCS
    .map(d => ({...d, s: score(d.text, query)}))
    .sort((a,b) => b.s - a.s)
    .slice(0,k);
}

// ------------------- Ask local LLM via Ollama -------------------
async function askLLM(userQuestion){
  const hits = topKDocs(userQuestion, 10);
  const context = hits.map((h,i)=>`[${i+1}] ${h.text}`).join("\n");

  const sys = `You are a helpful assistant answering ONLY from the provided context of Rohan's 8-month journey.
If the answer is not in context, reply: "I don't know based on the provided data."
Always cite bracket numbers like [2],[5].`;

  const prompt = `Context:\n${context}\n\nQuestion: ${userQuestion}\nAnswer:`;

  try {
    const response = await fetch("http://localhost:11434/api/chat", {   // Ollama endpoint
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "llama3",   // Change this if you pulled a different model
        messages: [
          { role: "system", content: sys },
          { role: "user", content: prompt }
        ],
        stream: false
      })
    });

    const data = await response.json();
    return data.message?.content || data.choices?.[0]?.message?.content || "⚠️ No answer generated.";
  } catch (e) {
    console.error("LLM error:", e);
    return "❌ Error connecting to local LLM. Make sure Ollama is running.";
  }
}

// ------------------- UI helpers -------------------
function addMessage(text, who){
  const box = document.querySelector(".chat-messages");
  const div = document.createElement("div");
  div.className = `message ${who}`;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}
function replaceLastBotMessage(text){
  const box = document.querySelector(".chat-messages");
  const msgs = [...box.querySelectorAll(".message.ai")];
  (msgs[msgs.length-1]||{}).textContent = text;
}

// ------------------- Hook button -------------------
document.querySelector(".chat-input button").addEventListener("click", async () => {
  const input = document.querySelector(".chat-input input");
  const q = input.value.trim();
  if (!q) return;
  addMessage(q, "user");
  input.value = "";
  addMessage("Thinking…", "ai");
  const answer = await askLLM(q);
  replaceLastBotMessage(answer);
});

// ------------------- Start -------------------
window.addEventListener("DOMContentLoaded", async () => {
  await loadJourney();
});
</script>
</body>
</html>
